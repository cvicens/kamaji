<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e93">
<title>kamaji todos</title>
<style>
  /* Palette follows the "one neutral base, one accent, one text colour"
     rule for minimal UIs -- teal is the single accent and carries every
     interactive affordance; nothing else is coloured except the danger
     path. Three type sizes, two weights, no third font. */
  :root {
    color-scheme: light dark;
    --bg: #eef5f4;
    --surface: #ffffff;
    --surface-sunken: #f4f8f8;
    --text: #14302e;
    --muted: #6c8785;
    --faint: #a8bcba;
    --border: #dde9e7;
    --accent: #2f9e93;
    --accent-deep: #1f7a72;
    --accent-soft: #d9efec;
    --on-accent: #ffffff;
    --danger: #c2473c;
    --danger-soft: #fbe6e4;
    --hero-from: #35b0a3;
    --hero-to: #1f7a72;
    --shadow: 0 1px 2px rgba(20, 48, 46, 0.05), 0 8px 24px -12px rgba(20, 48, 46, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1a19;
      --surface: #152624;
      --surface-sunken: #11201f;
      --text: #e4efed;
      --muted: #8ba7a4;
      --faint: #4d6b68;
      --border: #223936;
      --accent: #4cc4b6;
      --accent-deep: #7fdccf;
      --accent-soft: #1b3a37;
      --on-accent: #06201d;
      --danger: #e88a80;
      --danger-soft: #38201d;
      --hero-from: #1d6b64;
      --hero-to: #10403c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  input, textarea { font: inherit; color: var(--text); }

  /* ---------- login ---------- */
  #login-screen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    background: linear-gradient(160deg, var(--hero-from), var(--hero-to));
  }
  #login-screen form {
    background: var(--surface);
    border-radius: 1.5rem;
    padding: 2rem 1.75rem;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  #login-screen .mark {
    width: 3rem; height: 3rem; margin: 0 auto 1rem;
    border-radius: 1rem;
    background: var(--accent-soft);
    display: grid; place-items: center;
    color: var(--accent-deep);
  }
  #login-screen h1 { font-size: 1.25rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  #login-screen p.sub { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.875rem; }
  #totp {
    width: 100%;
    text-align: center;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    padding: 0.75rem 0.5rem;
    border-radius: 0.875rem;
    border: 1.5px solid var(--border);
    background: var(--surface-sunken);
  }
  #totp:focus { outline: none; border-color: var(--accent); }
  #login-error { color: var(--danger); font-size: 0.8125rem; min-height: 1.2rem; margin-top: 0.75rem; }

  /* ---------- shell ---------- */
  #app { max-width: 640px; margin: 0 auto; padding-bottom: 7rem; }

  /* ---------- hero: greeting + completion score ---------- */
  .hero {
    background: linear-gradient(150deg, var(--hero-from), var(--hero-to));
    color: #ffffff;
    padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem 2.75rem;
    border-radius: 0 0 1.75rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .hero .eyebrow {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    opacity: 0.75;
    margin: 0 0 0.3rem;
  }
  .hero h1 { font-size: 1.5rem; margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  .hero .today { margin: 0.3rem 0 0; font-size: 0.875rem; opacity: 0.82; }

  #logout-btn {
    border: none;
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    border-radius: 999px;
    padding: 0.35rem 0.75rem;
    font-size: 0.75rem;
    margin-top: 0.75rem;
  }

  /* Completeness meter: the ring leaves the count in the middle, which is
     the part people actually read (radial progress is only worth the space
     if the number lives at its centre). */
  .score { position: relative; width: 92px; height: 92px; flex: 0 0 auto; }
  .score svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .score .track { stroke: rgba(255, 255, 255, 0.22); }
  .score .fill {
    stroke: #ffffff;
    transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .score .readout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: 1;
  }
  .score .count { font-size: 1.1rem; font-weight: 600; }
  .score .label { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; margin-top: 0.25rem; }

  /* ---------- filters ---------- */
  .filter-card {
    background: var(--surface);
    margin: -1.75rem 1rem 0;
    border-radius: 1.125rem;
    box-shadow: var(--shadow);
    padding: 0.5rem;
    position: relative;
    z-index: 2;
  }
  .scopes { display: flex; gap: 0.25rem; }
  .scopes button {
    flex: 1;
    border: none;
    background: none;
    color: var(--muted);
    border-radius: 0.75rem;
    padding: 0.55rem 0.25rem;
    font-size: 0.8125rem;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .scopes button.active {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  .period {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: 0.25rem;
    padding: 0.4rem 0.25rem 0.15rem;
    border-top: 1px solid var(--border);
  }
  .period[hidden] { display: none; }
  .period .step {
    border: none;
    background: var(--surface-sunken);
    color: var(--muted);
    width: 2rem; height: 2rem;
    border-radius: 0.625rem;
    display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .period .step:hover { color: var(--accent-deep); }
  .period .centre {
    flex: 1 1 auto;
    min-width: 0;
    text-align: center;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text);
  }
  /* Native date/month pickers: the browser's own calendar is better than
     anything hand-rolled here, so only the chrome is restyled. */
  .period input {
    width: 100%;
    border: none;
    background: none;
    text-align: center;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text);
    padding: 0.35rem 0;
  }
  .period input:focus { outline: none; }
  .period input::-webkit-calendar-picker-indicator { opacity: 0.45; cursor: pointer; }

  /* ---------- list ---------- */
  main { padding: 1.25rem 1rem 0; }
  .day-heading {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin: 1.5rem 0 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .day-heading:first-child { margin-top: 0; }
  .day-heading .n { color: var(--faint); font-weight: 500; letter-spacing: 0; text-transform: none; }

  .task {
    display: flex;
    gap: 0.75rem;
    background: var(--surface);
    border-radius: 1rem;
    padding: 0.85rem 0.9rem;
    margin-bottom: 0.5rem;
    box-shadow: var(--shadow);
  }
  .task.done { background: var(--surface-sunken); box-shadow: none; }

  /* One tap-target does the whole open/closed flip -- the old UI spent a
     full-width button on it, which is the kind of visible choice a minimal
     list can't afford per row. */
  .check {
    flex: 0 0 auto;
    width: 1.375rem; height: 1.375rem;
    margin-top: 0.1rem;
    border-radius: 50%;
    border: 2px solid var(--faint);
    background: none;
    padding: 0;
    display: grid; place-items: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { width: 0.75rem; height: 0.75rem; opacity: 0; transition: opacity 0.15s; }
  .task.done .check { background: var(--accent); border-color: var(--accent); }
  .task.done .check svg { opacity: 1; color: var(--on-accent); }

  .task-body { flex: 1 1 auto; min-width: 0; }
  .task-text {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
    font-size: 0.9375rem;
  }
  .task.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-text a { color: var(--accent-deep); }
  .task-meta { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 0.4rem; }
  .chip {
    background: var(--accent-soft);
    color: var(--accent-deep);
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .chip.plain { background: var(--surface-sunken); color: var(--muted); font-family: ui-monospace, monospace; }
  .task-links { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; word-break: break-all; }

  .more {
    flex: 0 0 auto;
    border: none;
    background: none;
    color: var(--faint);
    padding: 0 0.15rem;
    align-self: flex-start;
    line-height: 1;
    font-size: 1.1rem;
  }
  .more:hover { color: var(--muted); }
  .task-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .task-actions button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 0.625rem;
    padding: 0.35rem 0.7rem;
    font-size: 0.8125rem;
  }
  .task-actions button.danger { color: var(--danger); border-color: var(--danger-soft); }

  .edit-box {
    width: 100%;
    border: 1.5px solid var(--accent);
    border-radius: 0.75rem;
    background: var(--surface);
    padding: 0.5rem 0.6rem;
    resize: vertical;
    min-height: 3.5rem;
    line-height: 1.45;
  }
  .edit-box:focus { outline: none; }

  /* Completed work collapses out of the way -- present for the score and
     for reopening, but never competing with what's still open. */
  #done-section { margin-top: 1.5rem; }
  #done-toggle {
    width: 100%;
    border: none;
    background: none;
    color: var(--muted);
    text-align: left;
    padding: 0.5rem 0.15rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  #done-toggle .caret { transition: transform 0.2s; }
  #done-toggle.open .caret { transform: rotate(90deg); }

  .empty {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--muted);
  }
  .empty .glyph {
    width: 3.5rem; height: 3.5rem;
    margin: 0 auto 0.9rem;
    border-radius: 1.25rem;
    background: var(--accent-soft);
    color: var(--accent-deep);
    display: grid; place-items: center;
  }
  .empty p { margin: 0; font-size: 0.9375rem; }
  .empty .hint { margin-top: 0.3rem; font-size: 0.8125rem; color: var(--faint); }

  footer.tally {
    text-align: center;
    color: var(--faint);
    font-size: 0.8125rem;
    padding: 1.75rem 1rem 0;
  }

  /* ---------- add ---------- */
  #fab {
    position: fixed;
    right: max(1.25rem, calc(50% - 320px + 1.25rem));
    bottom: calc(1.5rem + env(safe-area-inset-bottom));
    width: 3.5rem; height: 3.5rem;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 10px 24px -6px rgba(31, 122, 114, 0.55);
    display: grid; place-items: center;
    z-index: 10;
  }
  #fab:active { transform: scale(0.94); }

  dialog {
    border: none;
    padding: 0;
    background: transparent;
    color: var(--text);
    max-width: 480px;
    width: 100%;
  }
  dialog::backdrop { background: rgba(10, 30, 28, 0.5); backdrop-filter: blur(2px); }
  .sheet {
    background: var(--surface);
    border-radius: 1.25rem;
    padding: 1.25rem;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  }
  .sheet h2 { margin: 0 0 0.9rem; font-size: 1rem; font-weight: 600; }
  .sheet p { margin: 0 0 0.6rem; font-size: 0.875rem; color: var(--muted); line-height: 1.5; }
  .sheet .strong { color: var(--text); font-weight: 600; }
  #new-text {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 0.875rem;
    background: var(--surface-sunken);
    padding: 0.75rem 0.85rem;
    resize: vertical;
    min-height: 5rem;
    line-height: 1.45;
  }
  #new-text:focus { outline: none; border-color: var(--accent); }
  .sheet-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 0.75rem;
    padding: 0.6rem 1.1rem;
    font-size: 0.875rem;
    font-weight: 500;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #ffffff; font-weight: 600; }

  #banner {
    position: fixed;
    visibility: hidden;
    left: 50%; top: calc(0.9rem + env(safe-area-inset-top));
    transform: translateX(-50%) translateY(-140%);
    background: var(--danger); color: #ffffff;
    padding: 0.65rem 1.1rem;
    border-radius: 0.875rem;
    font-size: 0.875rem;
    max-width: min(92vw, 420px);
    z-index: 30;
    box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.5);
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  #banner.show { visibility: visible; transform: translateX(-50%) translateY(0); }
  #banner.ok { background: var(--accent-deep); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  const { html, render, useState, useEffect, useRef, useCallback, useMemo } = htmPreact;

  const TOKEN_KEY = "kamaji_todo_token";
  const SCOPE_KEY = "kamaji_todo_scope";

  /* ================= dates ================= */

  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }
  function sameDay(a, b) { return a.getTime() === b.getTime(); }

  // Monday-start week, matching how the notes repo's day headings read to a
  // European user -- not the JS default of Sunday.
  function startOfWeek(d) { return addDays(startOfDay(d), -((d.getDay() + 6) % 7)); }

  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function isoMonth(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }

  // An entry's date comes straight out of its key ("YYYY-MM-DD-N") -- the key
  // *is* the creation date plus position (see checklist::EntryKey), so there's
  // no separate timestamp to fetch. Built from parts rather than Date.parse so
  // it lands on local midnight, not UTC midnight, which would shift the day
  // for anyone west of Greenwich.
  function entryDate(entry) {
    const m = /^(\d{4})-(\d{2})-(\d{2})-/.exec(entry.key);
    return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
  }

  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];

  function shortDate(d) {
    return DAYS[d.getDay()].slice(0, 3) + " " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3);
  }

  function dayHeading(d) {
    const today = startOfDay(new Date());
    if (sameDay(d, today)) return "Today";
    if (sameDay(d, addDays(today, -1))) return "Yesterday";
    if (sameDay(d, addDays(today, 1))) return "Tomorrow";
    const label = DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
    return d.getFullYear() === today.getFullYear() ? label : label + " " + d.getFullYear();
  }

  function greetingFor(d) {
    const h = d.getHours();
    return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  /* ================= scope ================= */

  function inScope(entry, scope, anchor) {
    if (scope === "all") return true;
    const d = entryDate(entry);
    if (!d) return false;
    if (scope === "day") return sameDay(d, anchor);
    if (scope === "month") {
      return d.getFullYear() === anchor.getFullYear() && d.getMonth() === anchor.getMonth();
    }
    const from = startOfWeek(anchor);
    return d >= from && d < addDays(from, 7);
  }

  function groupByDay(entries) {
    const groups = [];
    let current = null;
    for (const entry of entries) {
      const d = entryDate(entry);
      const stamp = d ? d.getTime() : 0;
      if (!current || current.stamp !== stamp) {
        current = { stamp, date: d, entries: [] };
        groups.push(current);
      }
      current.entries.push(entry);
    }
    return groups;
  }

  /* ================= text ================= */

  // Mirrors kamaji-core's tags::parse_tag_token/extract_tags closely enough for
  // a live preview: whitespace-delimited, trim a few edge characters, require
  // at least one letter so a bare #123 isn't treated as a tag.
  function extractTags(text) {
    const out = [];
    for (let token of text.split(/\s+/)) {
      token = token.replace(/^[("']+/, "").replace(/[,.;:!?)\]}"']+$/, "");
      if (!token.startsWith("#")) continue;
      const rest = token.slice(1);
      if (!rest) continue;
      if (!/^[A-Za-z0-9_-]+$/.test(rest)) continue;
      if (!/[A-Za-z]/.test(rest)) continue;
      out.push(rest);
    }
    return out;
  }

  function linkify(text) {
    const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  /* ================= api ================= */

  function token() { return localStorage.getItem(TOKEN_KEY); }

  // localStorage throws outright in some privacy modes rather than just
  // returning null, so every access is guarded -- a browser that refuses to
  // persist the scope preference should still render a working app.
  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }

  /* ================= components ================= */

  const Icon = ({ d, size, sw }) => html`
    <svg width=${size || 14} height=${size || 14} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width=${sw || 2.5}
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d=${d} />
    </svg>`;

  const CHECK_PATH = "M20 6L9 17l-5-5";
  const CHEVRON_L = "M15 18l-6-6 6-6";
  const CHEVRON_R = "M9 18l6-6-6-6";

  /* Completeness meter: the ring leaves the count in the middle, which is the
     part people actually read -- radial progress only earns its space if the
     number lives at its centre. */
  function ScoreRing({ done, total }) {
    const r = 40;
    const circumference = 2 * Math.PI * r;
    const ratio = total === 0 ? 0 : done / total;
    return html`
      <div class="score">
        <svg viewBox="0 0 92 92" aria-hidden="true">
          <circle class="track" cx="46" cy="46" r=${r} />
          <circle class="fill" cx="46" cy="46" r=${r}
                  style=${{
                    strokeDasharray: circumference + " " + circumference,
                    strokeDashoffset: circumference * (1 - ratio),
                  }} />
        </svg>
        <div class="readout">
          <span class="count">${done}/${total}</span>
          <span class="label">${total === 1 ? "Task" : "Tasks"}</span>
        </div>
      </div>`;
  }

  function Hero({ done, total, onLogout }) {
    const now = new Date();
    return html`
      <div class="hero">
        <div>
          <p class="eyebrow">Focus to-do</p>
          <h1>${greetingFor(now)}</h1>
          <p class="today">${dayHeading(startOfDay(now))}, ${shortDate(now)}</p>
          <button id="logout-btn" onClick=${onLogout}>Log out</button>
        </div>
        <${ScoreRing} done=${done} total=${total} />
      </div>`;
  }

  const SCOPES = [
    { id: "day", label: "Day" },
    { id: "week", label: "Week" },
    { id: "month", label: "Month" },
    { id: "all", label: "All" },
  ];

  function FilterCard({ scope, anchor, onScope, onAnchor }) {
    // A real <input type=date>/<input type=month> rather than a hand-rolled
    // calendar: the browser's own picker is better on every platform this gets
    // opened on, and it keeps "jump to any date" as one control, not a grid.
    let centre;
    if (scope === "day") {
      centre = html`<input type="date" value=${isoDate(anchor)} onChange=${(e) => {
        const p = e.target.value.split("-");
        if (p.length === 3) onAnchor(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
      }} />`;
    } else if (scope === "month") {
      centre = html`<input type="month" value=${isoMonth(anchor)} onChange=${(e) => {
        const p = e.target.value.split("-");
        if (p.length === 2) onAnchor(new Date(Number(p[0]), Number(p[1]) - 1, 1));
      }} />`;
    } else {
      const from = startOfWeek(anchor);
      centre = html`${shortDate(from)} – ${shortDate(addDays(from, 6))}`;
    }

    const step = (dir) => {
      if (scope === "day") onAnchor(addDays(anchor, dir));
      else if (scope === "week") onAnchor(addDays(anchor, 7 * dir));
      else if (scope === "month") onAnchor(addMonths(anchor, dir));
    };

    return html`
      <div class="filter-card">
        <div class="scopes">
          ${SCOPES.map((s) => html`
            <button key=${s.id} class=${scope === s.id ? "active" : ""}
                    onClick=${() => onScope(s.id)}>${s.label}</button>`)}
        </div>
        <div class="period" hidden=${scope === "all"}>
          <button class="step" aria-label="Previous" onClick=${() => step(-1)}>
            <${Icon} d=${CHEVRON_L} size=${16} />
          </button>
          <div class="centre">${centre}</div>
          <button class="step" aria-label="Next" onClick=${() => step(1)}>
            <${Icon} d=${CHEVRON_R} size=${16} />
          </button>
        </div>
      </div>`;
  }

  function TagChips({ tags }) {
    return html`${tags.map((t) => html`<span key=${t} class="chip">#${t}</span>`)}`;
  }

  /* Each Task owns its own expanded/editing state. That's the whole reason for
     the component layer: the list re-renders on every mutation, and keyed
     diffing means an open edit box keeps its focus, caret and scroll position
     instead of being rebuilt from scratch underneath the cursor. */
  function Task({ entry, onToggle, onSave, onDelete }) {
    const [expanded, setExpanded] = useState(false);
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState(entry.text);
    const [busy, setBusy] = useState(false);
    const done = entry.status === "closed";

    const beginEdit = () => { setDraft(entry.text); setEditing(true); setExpanded(false); };

    const save = async () => {
      const text = draft.trim();
      if (!text) return;
      setBusy(true);
      const ok = await onSave(entry, text);
      setBusy(false);
      if (ok) setEditing(false);
    };

    const body = editing
      ? html`
        <div>
          <textarea class="edit-box" value=${draft} autofocus
                    onInput=${(e) => setDraft(e.target.value)}
                    onKeyDown=${(e) => {
                      if (e.key === "Escape") setEditing(false);
                      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
                    }} />
          <div class="task-meta"><${TagChips} tags=${extractTags(draft)} /></div>
          <div class="task-actions">
            <button type="button" disabled=${busy || !draft.trim()} onClick=${save}>
              ${busy ? "Saving…" : "Save"}
            </button>
            <button type="button" onClick=${() => setEditing(false)}>Cancel</button>
          </div>
        </div>`
      : html`
        <div>
          <div class="task-text" dangerouslySetInnerHTML=${{ __html: linkify(entry.text) }} />
          ${(entry.tags.length > 0 || expanded) && html`
            <div class="task-meta">
              <${TagChips} tags=${entry.tags} />
              ${/* The raw key is the address /todo resolve takes in chat, so it
                    earns a place -- but only once expanded, since it's machine
                    detail nobody scans a list for. */ ""}
              ${expanded && html`<span class="chip plain">${entry.key}</span>`}
            </div>`}
          ${entry.links.length > 0 && html`
            <div class="task-links">↳ ${entry.links.join(", ")}</div>`}
          ${expanded && html`
            <div class="task-actions">
              <button type="button" onClick=${beginEdit}>Edit</button>
              <button type="button" class="danger" onClick=${() => onDelete(entry)}>Delete</button>
            </div>`}
        </div>`;

    return html`
      <div class=${"task" + (done ? " done" : "")}>
        <button class="check" aria-label=${done ? "Reopen" : "Complete"}
                onClick=${() => onToggle(entry)}>
          <${Icon} d=${CHECK_PATH} size=${12} sw=${3} />
        </button>
        <div class="task-body">${body}</div>
        ${!editing && html`
          <button class="more" aria-label="More actions"
                  onClick=${() => setExpanded(!expanded)}>⋯</button>`}
      </div>`;
  }

  function EmptyState({ hasCompleted }) {
    return html`
      <div class="empty">
        <div class="glyph"><${Icon} d=${CHECK_PATH} size=${24} sw=${2} /></div>
        <p>${hasCompleted ? "Everything here is done." : "Nothing scheduled here."}</p>
        <p class="hint">${hasCompleted ? "Enjoy the quiet." : "Tap + to add the first one."}</p>
      </div>`;
  }

  function OpenList({ entries, scope, taskProps }) {
    // A single-day view needs no day headings -- the period bar above already
    // says which day this is.
    if (scope === "day") {
      return html`${entries.map((e) => html`<${Task} key=${e.key} entry=${e} ...${taskProps} />`)}`;
    }
    return html`${groupByDay(entries).map((g) => html`
      <div key=${g.stamp}>
        <div class="day-heading">
          <span>${g.date ? dayHeading(g.date) : "Undated"}</span>
          <span class="n">${g.entries.length}</span>
        </div>
        ${g.entries.map((e) => html`<${Task} key=${e.key} entry=${e} ...${taskProps} />`)}
      </div>`)}`;
  }

  /* Completed work collapses out of the way -- present for the score and for
     reopening, but never competing with what is still open. */
  function DoneSection({ entries, taskProps }) {
    const [open, setOpen] = useState(false);
    if (entries.length === 0) return null;
    return html`
      <div id="done-section">
        <button id="done-toggle" class=${open ? "open" : ""} onClick=${() => setOpen(!open)}>
          <span class="caret"><${Icon} d=${CHEVRON_R} size=${12} sw=${3} /></span>
          <span>Completed · ${entries.length}</span>
        </button>
        ${open && html`
          <div id="done-list">
            ${entries.map((e) => html`<${Task} key=${e.key} entry=${e} ...${taskProps} />`)}
          </div>`}
      </div>`;
  }

  // A <dialog> is imperative by nature (showModal/close), so the one place the
  // declarative tree has to reach into the DOM is here.
  function useDialog(open, onClose) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      if (open && !el.open) el.showModal();
      if (!open && el.open) el.close();
    }, [open]);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      // Esc and backdrop dismissal both fire `close` without going through our
      // buttons; without this the parent's state would say "open" forever.
      const handler = () => onClose();
      el.addEventListener("close", handler);
      return () => el.removeEventListener("close", handler);
    }, [onClose]);
    return ref;
  }

  function ComposeDialog({ open, onClose, onAdd }) {
    const [text, setText] = useState("");
    const [busy, setBusy] = useState(false);
    const ref = useDialog(open, onClose);

    const submit = async () => {
      const trimmed = text.trim();
      if (!trimmed) return;
      setBusy(true);
      const ok = await onAdd(trimmed);
      setBusy(false);
      if (ok) setText("");
    };

    return html`
      <dialog id="compose-dialog" ref=${ref}>
        <div class="sheet">
          <h2>New todo</h2>
          <textarea id="new-text" value=${text} autofocus
                    placeholder=${"What needs doing?\n#tags and links work right in the text."}
                    onInput=${(e) => setText(e.target.value)}
                    onKeyDown=${(e) => {
                      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit();
                    }} />
          <div class="task-meta"><${TagChips} tags=${extractTags(text)} /></div>
          <div class="sheet-actions">
            <button class="btn" type="button" onClick=${onClose}>Cancel</button>
            <button class="btn primary" type="button" disabled=${busy || !text.trim()}
                    onClick=${submit}>${busy ? "Adding…" : "Add"}</button>
          </div>
        </div>
      </dialog>`;
  }

  function DeleteDialog({ entry, onClose, onConfirm }) {
    const ref = useDialog(!!entry, onClose);
    return html`
      <dialog id="delete-dialog" ref=${ref}>
        <div class="sheet">
          <h2>Delete permanently?</h2>
          <p class="strong">${entry ? entry.text : ""}</p>
          <p>This removes the file and commits the removal. Unlike completing a
             todo, there is no reopening this one.</p>
          <div class="sheet-actions">
            <button class="btn" type="button" onClick=${onClose}>Cancel</button>
            <button class="btn danger" type="button" onClick=${onConfirm}>Delete</button>
          </div>
        </div>
      </dialog>`;
  }

  function Banner({ note }) {
    return html`
      <div id="banner" role="status"
           class=${(note ? "show " : "") + (note && note.ok ? "ok" : "")}>
        ${note ? note.text : ""}
      </div>`;
  }

  function Login({ onToken }) {
    const [code, setCode] = useState("");
    const [error, setError] = useState("");

    const submit = async (e) => {
      e.preventDefault();
      setError("");
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code.trim() }),
        });
        // Read the body as text first, then try to parse it as JSON -- a 401
        // from login_handler is JSON (`{"error": "..."}`), but a 429 from the
        // rate limiter in front of this route is plain text ("Too Many
        // Requests! Wait for Ns"), and blindly calling res.json() on that
        // throws, masking the real status behind a generic "network error".
        // Always surfacing res.status directly means a rate-limit and a bad
        // code are never confused again.
        const bodyText = await res.text();
        let data = null;
        try { data = JSON.parse(bodyText); } catch (parseErr) { /* not json */ }
        if (!res.ok) {
          setError("HTTP " + res.status + ": " + ((data && data.error) || bodyText || "login failed"));
          return;
        }
        if (!data || !data.token) {
          setError("unexpected response from server: " + bodyText);
          return;
        }
        onToken(data.token);
      } catch (err) {
        setError("network error: " + err.message);
      }
    };

    return html`
      <div id="login-screen">
        <form onSubmit=${submit}>
          <div class="mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
          </div>
          <h1>kamaji todos</h1>
          <p class="sub">Enter the code from your authenticator</p>
          <input id="totp" type="text" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]*" maxlength="6" placeholder="······" required autofocus
                 value=${code} onInput=${(e) => setCode(e.target.value)} />
          <div id="login-error">${error}</div>
          <button type="submit" class="btn primary" style="width:100%; margin-top:0.75rem">Unlock</button>
        </form>
      </div>`;
  }

  /* ================= root ================= */

  function App() {
    const [authed, setAuthed] = useState(!!token());
    const [entries, setEntries] = useState([]);
    const [scope, setScope] = useState(() => {
      const saved = safeGet(SCOPE_KEY);
      return ["day", "week", "month", "all"].includes(saved) ? saved : "day";
    });
    const [anchor, setAnchor] = useState(() => startOfDay(new Date()));
    const [note, setNote] = useState(null);
    const [composing, setComposing] = useState(false);
    const [deleting, setDeleting] = useState(null);

    const notify = useCallback((text, ok) => {
      setNote({ text, ok: ok === true, at: Date.now() });
    }, []);

    useEffect(() => {
      if (!note) return;
      const t = setTimeout(() => setNote(null), 4000);
      return () => clearTimeout(t);
    }, [note]);

    const api = useCallback(async (path, options) => {
      options = options || {};
      const headers = Object.assign({}, options.headers, { Authorization: "Bearer " + token() });
      if (options.body !== undefined) headers["Content-Type"] = "application/json";
      const res = await fetch(path, Object.assign({}, options, { headers }));
      if (res.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        setAuthed(false);
        throw new Error("session expired, please log in again");
      }
      let data = null;
      try { data = await res.json(); } catch (e) { /* no body */ }
      if (!res.ok) {
        throw new Error((data && (data.error || data.message)) || ("request failed (" + res.status + ")"));
      }
      return data;
    }, []);

    const reload = useCallback(async () => {
      try {
        // One `status=all` read rather than two round trips: the completion
        // score needs both halves of the same window, and every scope filter
        // below is a pure client-side slice of this one list.
        setEntries(await api("/api/todos?status=all"));
      } catch (err) {
        notify(err.message);
      }
    }, [api, notify]);

    useEffect(() => { if (authed) reload(); }, [authed, reload]);

    const scoped = useMemo(
      () => entries.filter((e) => inScope(e, scope, anchor)),
      [entries, scope, anchor]
    );
    const open = useMemo(() => scoped.filter((e) => e.status === "open"), [scoped]);
    const closed = useMemo(() => scoped.filter((e) => e.status === "closed"), [scoped]);

    const onToggle = useCallback(async (entry) => {
      const action = entry.status === "closed" ? "reopen" : "resolve";
      try {
        await api("/api/todos/" + encodeURIComponent(entry.key) + "/" + action, { method: "POST" });
        await reload();
      } catch (err) { notify(err.message); }
    }, [api, reload, notify]);

    const onSave = useCallback(async (entry, text) => {
      try {
        await api("/api/todos/" + encodeURIComponent(entry.key), {
          method: "PATCH",
          body: JSON.stringify({ text, tags: extractTags(text) }),
        });
        await reload();
        return true;
      } catch (err) { notify(err.message); return false; }
    }, [api, reload, notify]);

    const onAdd = useCallback(async (text) => {
      try {
        await api("/api/todos", {
          method: "POST",
          body: JSON.stringify({ text, tags: extractTags(text) }),
        });
        // A new todo is always filed under today, so a stale day/week/month
        // anchor would swallow it silently -- snap back to now rather than
        // letting a successful add look like a failure.
        if (scope !== "all") setAnchor(startOfDay(new Date()));
        setComposing(false);
        await reload();
        notify("Added", true);
        return true;
      } catch (err) { notify(err.message); return false; }
    }, [api, reload, notify, scope]);

    const onConfirmDelete = useCallback(async () => {
      const entry = deleting;
      setDeleting(null);
      if (!entry) return;
      try {
        await api("/api/todos/" + encodeURIComponent(entry.key), { method: "DELETE" });
        await reload();
      } catch (err) { notify(err.message); }
    }, [deleting, api, reload, notify]);

    const onLogout = useCallback(async () => {
      try { await api("/auth/logout", { method: "POST" }); } catch (e) { /* ignore */ }
      localStorage.removeItem(TOKEN_KEY);
      setAuthed(false);
      setEntries([]);
    }, [api]);

    const onScope = useCallback((next) => { setScope(next); safeSet(SCOPE_KEY, next); }, []);

    if (!authed) {
      return html`
        <${Login} onToken=${(t) => { safeSet(TOKEN_KEY, t); setAuthed(true); }} />
        <${Banner} note=${note} />`;
    }

    const taskProps = { onToggle, onSave, onDelete: setDeleting };
    const total = scoped.length;

    return html`
      <div id="app">
        <${Hero} done=${closed.length} total=${total} onLogout=${onLogout} />
        <${FilterCard} scope=${scope} anchor=${anchor} onScope=${onScope} onAnchor=${setAnchor} />
        <main>
          <div id="list">
            ${open.length === 0
              ? html`<${EmptyState} hasCompleted=${closed.length > 0} />`
              : html`<${OpenList} entries=${open} scope=${scope} taskProps=${taskProps} />`}
          </div>
          <${DoneSection} entries=${closed} taskProps=${taskProps} />
          <footer class="tally">
            ${total === 0 ? ""
              : open.length === 0 ? "All " + total + " done. Nothing left here."
              : open.length + " of " + total + " still open."}
          </footer>
        </main>
      </div>
      <button id="fab" aria-label="Add todo" onClick=${() => setComposing(true)}>
        <${Icon} d="M12 5v14M5 12h14" size=${24} />
      </button>
      <${ComposeDialog} open=${composing} onClose=${() => setComposing(false)} onAdd=${onAdd} />
      <${DeleteDialog} entry=${deleting} onClose=${() => setDeleting(null)} onConfirm=${onConfirmDelete} />
      <${Banner} note=${note} />`;
  }

  render(html`<${App} />`, document.getElementById("root"));
})();
</script>
</body>
</html>
