<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e93">
<title>kamaji</title>
<style>
  /* Palette follows the "one neutral base, one accent, one text colour"
     rule for minimal UIs -- teal is the single accent and carries every
     interactive affordance; nothing else is coloured except the danger
     path. Three type sizes, two weights, no third font. */
  :root {
    color-scheme: light dark;
    --bg: #eef5f4;
    --surface: #ffffff;
    --surface-sunken: #f4f8f8;
    --text: #14302e;
    --muted: #6c8785;
    --faint: #a8bcba;
    --border: #dde9e7;
    --accent: #2f9e93;
    --accent-deep: #1f7a72;
    --accent-soft: #d9efec;
    --on-accent: #ffffff;
    --danger: #c2473c;
    --danger-soft: #fbe6e4;
    --hero-from: #35b0a3;
    --hero-to: #1f7a72;
    --shadow: 0 1px 2px rgba(20, 48, 46, 0.05), 0 8px 24px -12px rgba(20, 48, 46, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1a19;
      --surface: #152624;
      --surface-sunken: #11201f;
      --text: #e4efed;
      --muted: #8ba7a4;
      --faint: #4d6b68;
      --border: #223936;
      --accent: #4cc4b6;
      --accent-deep: #7fdccf;
      --accent-soft: #1b3a37;
      --on-accent: #06201d;
      --danger: #e88a80;
      --danger-soft: #38201d;
      --hero-from: #1d6b64;
      --hero-to: #10403c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  input, textarea { font: inherit; color: var(--text); }

  /* ---------- login ---------- */
  #login-screen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    background: linear-gradient(160deg, var(--hero-from), var(--hero-to));
  }
  #login-screen form {
    background: var(--surface);
    border-radius: 1.5rem;
    padding: 2rem 1.75rem;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  #login-screen .mark {
    width: 3rem; height: 3rem; margin: 0 auto 1rem;
    border-radius: 1rem;
    background: var(--accent-soft);
    display: grid; place-items: center;
    color: var(--accent-deep);
  }
  #login-screen h1 { font-size: 1.25rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  #login-screen p.sub { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.875rem; }
  #totp {
    width: 100%;
    text-align: center;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    padding: 0.75rem 0.5rem;
    border-radius: 0.875rem;
    border: 1.5px solid var(--border);
    background: var(--surface-sunken);
  }
  #totp:focus { outline: none; border-color: var(--accent); }
  #login-error { color: var(--danger); font-size: 0.8125rem; min-height: 1.2rem; margin-top: 0.75rem; }

  /* ---------- shell ---------- */
  #app { max-width: 640px; margin: 0 auto; padding-bottom: 7rem; }

  /* ---------- hero: greeting + completion score ---------- */
  .hero {
    background: linear-gradient(150deg, var(--hero-from), var(--hero-to));
    color: #ffffff;
    padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem 2.75rem;
    border-radius: 0 0 1.75rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .hero .eyebrow {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    opacity: 0.75;
    margin: 0 0 0.3rem;
  }
  .hero h1 { font-size: 1.5rem; margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  .hero .today { margin: 0.3rem 0 0; font-size: 0.875rem; opacity: 0.82; }

  #logout-btn {
    border: none;
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    border-radius: 999px;
    padding: 0.35rem 0.75rem;
    font-size: 0.75rem;
    margin-top: 0.75rem;
  }

  /* Completeness meter: the ring leaves the count in the middle, which is
     the part people actually read (radial progress is only worth the space
     if the number lives at its centre). */
  .score { position: relative; width: 92px; height: 92px; flex: 0 0 auto; }
  .score svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .score .track { stroke: rgba(255, 255, 255, 0.22); }
  .score .fill {
    stroke: #ffffff;
    transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .score .readout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: 1;
  }
  .score.stat {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.22);
  }
  .score.stat .count { font-size: 1.5rem; }
  .score.stat .sub { font-size: 0.5625rem; opacity: 0.75; margin-top: 0.15rem; letter-spacing: 0.02em; }
  .score .count { font-size: 1.1rem; font-weight: 600; }
  .score .label { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; margin-top: 0.25rem; }

  /* ---------- filters ---------- */
  /* Takes the tuck-under-the-hero position the filter card used to hold --
     it's now the topmost card, and the filter card sits normally below it. */
  .domain-tabs {
    display: flex; gap: 0.25rem;
    margin: -1.75rem 1rem 0; padding: 0.25rem;
    background: var(--surface); border-radius: 1.125rem; box-shadow: var(--shadow);
    position: relative; z-index: 2;
  }
  .domain-tabs button {
    flex: 1 1 0; padding: 0.5rem 0.25rem; border: none; border-radius: 9px;
    background: transparent; color: var(--muted);
    font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.01em;
  }
  .domain-tabs button.active { background: var(--accent-soft); color: var(--accent-deep); }

  .filter-card {
    background: var(--surface);
    margin: 0.5rem 1rem 0;
    border-radius: 1.125rem;
    box-shadow: var(--shadow);
    padding: 0.5rem;
    position: relative;
    z-index: 2;
  }
  .scopes { display: flex; gap: 0.25rem; }
  .scopes button {
    flex: 1;
    border: none;
    background: none;
    color: var(--muted);
    border-radius: 0.75rem;
    padding: 0.55rem 0.25rem;
    font-size: 0.8125rem;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .scopes button.active {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  .period {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: 0.25rem;
    padding: 0.4rem 0.25rem 0.15rem;
    border-top: 1px solid var(--border);
  }
  .period[hidden] { display: none; }
  .period .step {
    border: none;
    background: var(--surface-sunken);
    color: var(--muted);
    width: 2rem; height: 2rem;
    border-radius: 0.625rem;
    display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .period .step:hover { color: var(--accent-deep); }
  .period .centre {
    flex: 1 1 auto;
    min-width: 0;
    text-align: center;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text);
  }
  /* Native date/month pickers: the browser's own calendar is better than
     anything hand-rolled here, so only the chrome is restyled. */
  .period input {
    width: 100%;
    border: none;
    background: none;
    text-align: center;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text);
    padding: 0.35rem 0;
  }
  .period input:focus { outline: none; }
  .period input::-webkit-calendar-picker-indicator { opacity: 0.45; cursor: pointer; }

  /* ---------- list ---------- */
  main { padding: 1.25rem 1rem 0; }
  .day-heading {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin: 1.5rem 0 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .day-heading:first-child { margin-top: 0; }
  .day-heading .n { color: var(--faint); font-weight: 500; letter-spacing: 0; text-transform: none; }

  .task {
    display: flex;
    gap: 0.75rem;
    background: var(--surface);
    border-radius: 1rem;
    padding: 0.85rem 0.9rem;
    margin-bottom: 0.5rem;
    box-shadow: var(--shadow);
  }
  .task.done { background: var(--surface-sunken); box-shadow: none; }

  /* One tap-target does the whole open/closed flip -- the old UI spent a
     full-width button on it, which is the kind of visible choice a minimal
     list can't afford per row. */
  .check {
    flex: 0 0 auto;
    width: 1.375rem; height: 1.375rem;
    margin-top: 0.1rem;
    border-radius: 50%;
    border: 2px solid var(--faint);
    background: none;
    padding: 0;
    display: grid; place-items: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { width: 0.75rem; height: 0.75rem; opacity: 0; transition: opacity 0.15s; }
  .task.done .check { background: var(--accent); border-color: var(--accent); }
  .task.done .check svg { opacity: 1; color: var(--on-accent); }

  .task-body { flex: 1 1 auto; min-width: 0; }
  .task-text {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
    font-size: 0.9375rem;
  }
  .task.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-text a { color: var(--accent-deep); }
  .task-meta { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 0.4rem; }
  .chip {
    background: var(--accent-soft);
    color: var(--accent-deep);
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .chip.plain { background: var(--surface-sunken); color: var(--muted); font-family: ui-monospace, monospace; }
  .task-links { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; word-break: break-all; }

  .more {
    flex: 0 0 auto;
    border: none;
    background: none;
    color: var(--faint);
    padding: 0 0.15rem;
    align-self: flex-start;
    line-height: 1;
    font-size: 1.1rem;
  }
  .more:hover { color: var(--muted); }
  .task-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .task-actions button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 0.625rem;
    padding: 0.35rem 0.7rem;
    font-size: 0.8125rem;
  }
  .task-actions button.danger { color: var(--danger); border-color: var(--danger-soft); }

  .task.fact { align-items: flex-start; }
  .fact-value {
    flex: 0 0 auto; width: 1.5rem; height: 1.5rem; margin-top: 0.1rem;
    border-radius: 8px; background: var(--accent-soft); color: var(--accent-deep);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8125rem; font-weight: 700;
  }
  .fact-title { font-weight: 600; font-size: 0.9375rem; margin-bottom: 0.15rem; }
  .fact-note { margin: 0.5rem 0 0; font-size: 0.75rem; color: var(--faint); line-height: 1.45; }
  .blocked { margin: 0.45rem 0 0; font-size: 0.75rem; color: var(--danger); line-height: 1.45; }

  .field { display: block; margin-bottom: 0.6rem; }
  .field > span {
    display: block; margin-bottom: 0.25rem;
    font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }
  .field input[type="text"] {
    width: 100%; padding: 0.5rem 0.6rem;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-sunken);
  }
  .field input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .field .edit-box { margin-top: 0; }
  .value-picker { display: flex; gap: 0.3rem; }
  .value-picker button {
    width: 2rem; height: 2rem; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface-sunken);
    color: var(--muted); font-size: 0.8125rem; font-weight: 600;
  }
  .value-picker button.active {
    background: var(--accent); border-color: var(--accent);
    color: var(--on-accent);
  }

  .edit-box {
    width: 100%;
    border: 1.5px solid var(--accent);
    border-radius: 0.75rem;
    background: var(--surface);
    padding: 0.5rem 0.6rem;
    resize: vertical;
    min-height: 3.5rem;
    line-height: 1.45;
  }
  .edit-box:focus { outline: none; }

  /* Completed work collapses out of the way -- present for the score and
     for reopening, but never competing with what's still open. */
  #done-section { margin-top: 1.5rem; }
  #done-toggle {
    width: 100%;
    border: none;
    background: none;
    color: var(--muted);
    text-align: left;
    padding: 0.5rem 0.15rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  #done-toggle .caret { transition: transform 0.2s; }
  #done-toggle.open .caret { transform: rotate(90deg); }

  .empty {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--muted);
  }
  .empty .glyph {
    width: 3.5rem; height: 3.5rem;
    margin: 0 auto 0.9rem;
    border-radius: 1.25rem;
    background: var(--accent-soft);
    color: var(--accent-deep);
    display: grid; place-items: center;
  }
  .empty p { margin: 0; font-size: 0.9375rem; }
  .empty .hint { margin-top: 0.3rem; font-size: 0.8125rem; color: var(--faint); }

  footer.tally {
    text-align: center;
    color: var(--faint);
    font-size: 0.8125rem;
    padding: 1.75rem 1rem 0;
  }

  /* ---------- add ---------- */
  #fab {
    position: fixed;
    right: max(1.25rem, calc(50% - 320px + 1.25rem));
    bottom: calc(1.5rem + env(safe-area-inset-bottom));
    width: 3.5rem; height: 3.5rem;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 10px 24px -6px rgba(31, 122, 114, 0.55);
    display: grid; place-items: center;
    z-index: 10;
  }
  #fab:active { transform: scale(0.94); }

  dialog {
    border: none;
    padding: 0;
    background: transparent;
    color: var(--text);
    max-width: 480px;
    width: 100%;
  }
  dialog::backdrop { background: rgba(10, 30, 28, 0.5); backdrop-filter: blur(2px); }
  .sheet {
    background: var(--surface);
    border-radius: 1.25rem;
    padding: 1.25rem;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  }
  .sheet h2 { margin: 0 0 0.9rem; font-size: 1rem; font-weight: 600; }
  .sheet p { margin: 0 0 0.6rem; font-size: 0.875rem; color: var(--muted); line-height: 1.5; }
  .sheet .strong { color: var(--text); font-weight: 600; }
  .sheet-note {
    margin: 0.6rem 0 0; padding: 0.55rem 0.7rem;
    background: var(--surface-sunken); border-radius: 10px;
    font-size: 0.75rem; color: var(--muted); line-height: 1.5;
  }
  #new-text {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 0.875rem;
    background: var(--surface-sunken);
    padding: 0.75rem 0.85rem;
    resize: vertical;
    min-height: 5rem;
    line-height: 1.45;
  }
  #new-text:focus { outline: none; border-color: var(--accent); }
  .sheet-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 0.75rem;
    padding: 0.6rem 1.1rem;
    font-size: 0.875rem;
    font-weight: 500;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #ffffff; font-weight: 600; }

  #banner {
    position: fixed;
    visibility: hidden;
    left: 50%; top: calc(0.9rem + env(safe-area-inset-top));
    transform: translateX(-50%) translateY(-140%);
    background: var(--danger); color: #ffffff;
    padding: 0.65rem 1.1rem;
    border-radius: 0.875rem;
    font-size: 0.875rem;
    max-width: min(92vw, 420px);
    z-index: 30;
    box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.5);
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  #banner.show { visibility: visible; transform: translateX(-50%) translateY(0); }
  #banner.ok { background: var(--accent-deep); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  const { html, render, useState, useEffect, useRef, useCallback, useMemo } = htmPreact;

  const TOKEN_KEY = "kamaji_todo_token";
  const SCOPE_KEY = "kamaji_todo_scope";
  const DOMAIN_KEY = "kamaji_domain";

  /* ================= dates ================= */

  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }
  function sameDay(a, b) { return a.getTime() === b.getTime(); }

  // Monday-start week, matching how the notes repo's day headings read to a
  // European user -- not the JS default of Sunday.
  function startOfWeek(d) { return addDays(startOfDay(d), -((d.getDay() + 6) % 7)); }

  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function isoMonth(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }

  // The one entry-date accessor for all three domains -- every date filter,
  // day heading and grouping goes through it, so there is never more than one
  // opinion about what day something belongs to.
  //
  // A checklist entry dates off its key ("YYYY-MM-DD-N"): the key *is* the
  // creation date plus position (see checklist::EntryKey), so there's no
  // separate timestamp to fetch. A fact has no key at all -- it dates off its
  // `timestamp` frontmatter ("YYYY-MM-DDTHH:MM:SSZ"), which is the same
  // instant its filename encodes. Both are built from parts rather than
  // Date.parse so they land on local midnight, not UTC midnight, which would
  // shift the day for anyone west of Greenwich.
  function itemDate(item) {
    const source = item.key || item.timestamp || "";
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(source);
    return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
  }

  // An item's stable identity, and so its `key=` prop in every list below:
  // the `EntryKey` string for a todo/goal, the wikilink target (its note path)
  // for a fact. Keyed diffing is the whole reason the component layer exists
  // -- an open edit box has to survive the list re-render that follows a save.
  function itemId(item) {
    return item.key || item.wikilink_target;
  }

  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];

  function shortDate(d) {
    return DAYS[d.getDay()].slice(0, 3) + " " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3);
  }

  function dayHeading(d) {
    const today = startOfDay(new Date());
    if (sameDay(d, today)) return "Today";
    if (sameDay(d, addDays(today, -1))) return "Yesterday";
    if (sameDay(d, addDays(today, 1))) return "Tomorrow";
    const label = DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
    return d.getFullYear() === today.getFullYear() ? label : label + " " + d.getFullYear();
  }

  function greetingFor(d) {
    const h = d.getHours();
    return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  /* ================= scope ================= */

  function inScope(item, scope, anchor) {
    if (scope === "all") return true;
    const d = itemDate(item);
    if (!d) return false;
    if (scope === "day") return sameDay(d, anchor);
    if (scope === "month") {
      return d.getFullYear() === anchor.getFullYear() && d.getMonth() === anchor.getMonth();
    }
    const from = startOfWeek(anchor);
    return d >= from && d < addDays(from, 7);
  }

  function groupByDay(items) {
    const groups = [];
    let current = null;
    for (const item of items) {
      const d = itemDate(item);
      const stamp = d ? d.getTime() : 0;
      if (!current || current.stamp !== stamp) {
        current = { stamp, date: d, entries: [] };
        groups.push(current);
      }
      current.entries.push(item);
    }
    return groups;
  }

  /* ================= domains ================= */

  /* The three things this page shows, and every way they differ. Todos and
     goals are the same `checklist` engine with different wording (see
     checklist/mod.rs), so they differ only in strings here; facts are a
     genuinely different shape -- no open/closed status, so no checkbox, no
     completion ring, and an editor with real fields instead of one text box. */
  const DOMAINS = {
    todo: {
      id: "todo", tab: "Todos", one: "todo", eyebrow: "Focus to-do",
      list: "/api/todos?status=all", base: "/api/todos",
      closeVerb: "resolve", closedLabel: "Completed", scoreLabel: "Tasks",
      addTitle: "New todo",
      addPlaceholder: "What needs doing?\n#tags and links work right in the text.",
      emptyDone: "Everything here is done.", emptyNone: "Nothing scheduled here.",
      emptyHintDone: "Enjoy the quiet.", emptyHintNone: "Tap + to add the first one.",
    },
    goal: {
      id: "goal", tab: "Goals", one: "goal", eyebrow: "What you're working towards",
      list: "/api/goals?status=all", base: "/api/goals",
      closeVerb: "achieve", closedLabel: "Achieved", scoreLabel: "Goals",
      addTitle: "New goal",
      addPlaceholder: "What are you working towards?\n#tags link goals to the todos that support them.",
      emptyDone: "Every goal here is achieved.", emptyNone: "No goals set for this period.",
      emptyHintDone: "Time to set the next one.", emptyHintNone: "Tap + to set one.",
    },
    fact: {
      id: "fact", tab: "Facts", one: "fact", eyebrow: "What you actually did",
      list: "/api/facts", base: "/api/facts",
      addTitle: "Log a fact", busyLabel: "Summarising…",
      addPlaceholder: "What did you get done?\nWrite it however you'd say it \u2014 this is kept verbatim.",
      // Facts are the one thing here that costs an agent call to create, and
      // it is not instant. Saying so up front is cheaper than a spinner that
      // looks stuck.
      addNote: "The agent turns this into a title, summary and value. Your raw text is kept verbatim alongside it, so nothing is lost in the summarising. Takes a few seconds.",
      emptyDone: "Nothing logged here.", emptyNone: "Nothing logged here.",
      emptyHintDone: "Tap + to log one.", emptyHintNone: "Tap + to log one.",
    },
  };

  const DOMAIN_IDS = ["todo", "goal", "fact"];

  /* ================= text ================= */

  // Mirrors kamaji-core's tags::parse_tag_token/extract_tags closely enough for
  // a live preview: whitespace-delimited, trim a few edge characters, require
  // at least one letter so a bare #123 isn't treated as a tag.
  function extractTags(text) {
    const out = [];
    for (let token of text.split(/\s+/)) {
      token = token.replace(/^[("']+/, "").replace(/[,.;:!?)\]}"']+$/, "");
      if (!token.startsWith("#")) continue;
      const rest = token.slice(1);
      if (!rest) continue;
      if (!/^[A-Za-z0-9_-]+$/.test(rest)) continue;
      if (!/[A-Za-z]/.test(rest)) continue;
      out.push(rest);
    }
    return out;
  }

  function blockedReason(keys) {
    const one = keys.length === 1;
    return keys.length + (one ? " todo still links" : " todos still link") +
      " to this goal (" + keys.join(", ") + "). Unlink " + (one ? "it" : "them") + " first.";
  }

  function capitalize(word) {
    return word ? word[0].toUpperCase() + word.slice(1) : "";
  }

  function linkify(text) {
    const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  /* ================= api ================= */

  function token() { return localStorage.getItem(TOKEN_KEY); }

  // localStorage throws outright in some privacy modes rather than just
  // returning null, so every access is guarded -- a browser that refuses to
  // persist the scope preference should still render a working app.
  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }

  /* ================= components ================= */

  const Icon = ({ d, size, sw }) => html`
    <svg width=${size || 14} height=${size || 14} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width=${sw || 2.5}
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d=${d} />
    </svg>`;

  const CHECK_PATH = "M20 6L9 17l-5-5";
  const CHEVRON_L = "M15 18l-6-6 6-6";
  const CHEVRON_R = "M9 18l6-6-6-6";

  /* Completeness meter: the ring leaves the count in the middle, which is the
     part people actually read -- radial progress only earns its space if the
     number lives at its centre. */
  function ScoreRing({ done, total, label }) {
    const r = 40;
    const circumference = 2 * Math.PI * r;
    const ratio = total === 0 ? 0 : done / total;
    return html`
      <div class="score">
        <svg viewBox="0 0 92 92" aria-hidden="true">
          <circle class="track" cx="46" cy="46" r=${r} />
          <circle class="fill" cx="46" cy="46" r=${r}
                  style=${{
                    strokeDasharray: circumference + " " + circumference,
                    strokeDashoffset: circumference * (1 - ratio),
                  }} />
        </svg>
        <div class="readout">
          <span class="count">${done}/${total}</span>
          <span class="label">${label}</span>
        </div>
      </div>`;
  }

  /* Facts have no open/closed status, so there is no ratio to draw -- a ring
     stuck at 0/N would be a lie dressed as a measurement. They get the two
     numbers that do mean something for a log: how much landed in this window,
     and how heavy it was. */
  function FactScore({ facts }) {
    const total = facts.length;
    const avg = total === 0
      ? null
      : Math.round((facts.reduce((sum, f) => sum + (f.value || 0), 0) / total) * 10) / 10;
    return html`
      <div class="score stat">
        <span class="count">${total}</span>
        <span class="label">${total === 1 ? "Fact" : "Facts"}</span>
        <span class="sub">${avg === null ? "—" : "avg value " + avg}</span>
      </div>`;
  }

  function Hero({ domain, done, total, facts, onLogout }) {
    const now = new Date();
    return html`
      <div class="hero">
        <div>
          <p class="eyebrow">${domain.eyebrow}</p>
          <h1>${greetingFor(now)}</h1>
          <p class="today">${dayHeading(startOfDay(now))}, ${shortDate(now)}</p>
          <button id="logout-btn" onClick=${onLogout}>Log out</button>
        </div>
        ${domain.id === "fact"
          ? html`<${FactScore} facts=${facts} />`
          : html`<${ScoreRing} done=${done} total=${total} label=${domain.scoreLabel} />`}
      </div>`;
  }

  function DomainTabs({ current, onSelect }) {
    return html`
      <div class="domain-tabs" role="tablist">
        ${DOMAIN_IDS.map((id) => html`
          <button key=${id} role="tab" aria-selected=${current === id}
                  class=${current === id ? "active" : ""}
                  onClick=${() => onSelect(id)}>${DOMAINS[id].tab}</button>`)}
      </div>`;
  }

  const SCOPES = [
    { id: "day", label: "Day" },
    { id: "week", label: "Week" },
    { id: "month", label: "Month" },
    { id: "all", label: "All" },
  ];

  function FilterCard({ scope, anchor, onScope, onAnchor }) {
    // A real <input type=date>/<input type=month> rather than a hand-rolled
    // calendar: the browser's own picker is better on every platform this gets
    // opened on, and it keeps "jump to any date" as one control, not a grid.
    let centre;
    if (scope === "day") {
      centre = html`<input type="date" value=${isoDate(anchor)} onChange=${(e) => {
        const p = e.target.value.split("-");
        if (p.length === 3) onAnchor(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
      }} />`;
    } else if (scope === "month") {
      centre = html`<input type="month" value=${isoMonth(anchor)} onChange=${(e) => {
        const p = e.target.value.split("-");
        if (p.length === 2) onAnchor(new Date(Number(p[0]), Number(p[1]) - 1, 1));
      }} />`;
    } else {
      const from = startOfWeek(anchor);
      centre = html`${shortDate(from)} – ${shortDate(addDays(from, 6))}`;
    }

    const step = (dir) => {
      if (scope === "day") onAnchor(addDays(anchor, dir));
      else if (scope === "week") onAnchor(addDays(anchor, 7 * dir));
      else if (scope === "month") onAnchor(addMonths(anchor, dir));
    };

    return html`
      <div class="filter-card">
        <div class="scopes">
          ${SCOPES.map((s) => html`
            <button key=${s.id} class=${scope === s.id ? "active" : ""}
                    onClick=${() => onScope(s.id)}>${s.label}</button>`)}
        </div>
        <div class="period" hidden=${scope === "all"}>
          <button class="step" aria-label="Previous" onClick=${() => step(-1)}>
            <${Icon} d=${CHEVRON_L} size=${16} />
          </button>
          <div class="centre">${centre}</div>
          <button class="step" aria-label="Next" onClick=${() => step(1)}>
            <${Icon} d=${CHEVRON_R} size=${16} />
          </button>
        </div>
      </div>`;
  }

  function TagChips({ tags }) {
    return html`${tags.map((t) => html`<span key=${t} class="chip">#${t}</span>`)}`;
  }

  /* Each Task owns its own expanded/editing state. That's the whole reason for
     the component layer: the list re-renders on every mutation, and keyed
     diffing means an open edit box keeps its focus, caret and scroll position
     instead of being rebuilt from scratch underneath the cursor. */
  function Task({ entry, domain, blockedBy, onToggle, onSave, onDelete }) {
    const [expanded, setExpanded] = useState(false);
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState(entry.text);
    const [busy, setBusy] = useState(false);
    const editRef = useAutoFocus(editing);
    const done = entry.status === "closed";
    const blocked = !!(blockedBy && blockedBy.length);

    const beginEdit = () => { setDraft(entry.text); setEditing(true); setExpanded(false); };

    const save = async () => {
      const text = draft.trim();
      if (!text) return;
      setBusy(true);
      const ok = await onSave(entry, text);
      setBusy(false);
      if (ok) setEditing(false);
    };

    const body = editing
      ? html`
        <div>
          <textarea class="edit-box" value=${draft} ref=${editRef}
                    onInput=${(e) => setDraft(e.target.value)}
                    onKeyDown=${(e) => {
                      if (e.key === "Escape") setEditing(false);
                      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
                    }} />
          <div class="task-meta"><${TagChips} tags=${extractTags(draft)} /></div>
          <div class="task-actions">
            <button type="button" disabled=${busy || !draft.trim()} onClick=${save}>
              ${busy ? "Saving…" : "Save"}
            </button>
            <button type="button" onClick=${() => setEditing(false)}>Cancel</button>
          </div>
        </div>`
      : html`
        <div>
          <div class="task-text" dangerouslySetInnerHTML=${{ __html: linkify(entry.text) }} />
          ${(entry.tags.length > 0 || expanded) && html`
            <div class="task-meta">
              <${TagChips} tags=${entry.tags} />
              ${/* The raw key is the address /todo resolve takes in chat, so it
                    earns a place -- but only once expanded, since it's machine
                    detail nobody scans a list for. */ ""}
              ${expanded && html`<span class="chip plain">${entry.key}</span>`}
            </div>`}
          ${entry.links.length > 0 && html`
            <div class="task-links">↳ ${entry.links.join(", ")}</div>`}
          ${expanded && html`
            <div>
              <div class="task-actions">
                <button type="button" onClick=${beginEdit}>Edit</button>
                ${/* A goal that todos still link to can't be deleted -- the
                      server refuses it (see worker::checklist_api_job), and
                      the reason is shown here rather than only after a
                      pointless click. */ ""}
                <button type="button" class="danger" disabled=${blocked}
                        onClick=${() => onDelete(entry)}>Delete</button>
              </div>
              ${blocked && html`<p class="blocked">${blockedReason(blockedBy)}</p>`}
            </div>`}
        </div>`;

    return html`
      <div class=${"task" + (done ? " done" : "")}>
        <button class="check" aria-label=${done ? "Reopen" : capitalize(domain.closeVerb)}
                onClick=${() => onToggle(entry)}>
          <${Icon} d=${CHECK_PATH} size=${12} sw=${3} />
        </button>
        <div class="task-body">${body}</div>
        ${!editing && html`
          <button class="more" aria-label="More actions"
                  onClick=${() => setExpanded(!expanded)}>⋯</button>`}
      </div>`;
  }

  function EmptyState({ domain, hasCompleted }) {
    return html`
      <div class="empty">
        <div class="glyph"><${Icon} d=${CHECK_PATH} size=${24} sw=${2} /></div>
        <p>${hasCompleted ? domain.emptyDone : domain.emptyNone}</p>
        <p class="hint">${hasCompleted ? domain.emptyHintDone : domain.emptyHintNone}</p>
      </div>`;
  }

  /* One list renderer for all three domains: the day grouping and the
     period-scoped headings are identical, only the row component differs.
     `row` is passed in rather than branched on here so a fourth domain would
     be a new component, not a new `if`. */
  function ItemList({ entries, scope, row }) {
    // A single-day view needs no day headings -- the period bar above already
    // says which day this is.
    if (scope === "day") {
      return html`${entries.map(row)}`;
    }
    return html`${groupByDay(entries).map((g) => html`
      <div key=${g.stamp}>
        <div class="day-heading">
          <span>${g.date ? dayHeading(g.date) : "Undated"}</span>
          <span class="n">${g.entries.length}</span>
        </div>
        ${g.entries.map(row)}
      </div>`)}`;
  }

  /* Completed work collapses out of the way -- present for the score and for
     reopening, but never competing with what is still open. */
  function DoneSection({ entries, domain, row }) {
    const [open, setOpen] = useState(false);
    if (entries.length === 0) return null;
    return html`
      <div id="done-section">
        <button id="done-toggle" class=${open ? "open" : ""} onClick=${() => setOpen(!open)}>
          <span class="caret"><${Icon} d=${CHEVRON_R} size=${12} sw=${3} /></span>
          <span>${domain.closedLabel} · ${entries.length}</span>
        </button>
        ${open && html`<div id="done-list">${entries.map(row)}</div>`}
      </div>`;
  }

  const VALUES = [1, 2, 3, 4, 5];

  /* A fact is not a task, so this is a sibling of `Task`, not a variant of it:
     there is no open/closed status, which means no checkbox to render (a dead
     one would invite a click that can never do anything) and no completion to
     score. The value badge takes the checkbox's place in the layout so the
     two lists still read as one page.

     Editing needs four real fields rather than one text box: a fact's tags are
     stored, not extracted from the body the way a todo's are, and title,
     summary and value are separate stored fields. `description` is absent on
     purpose -- it's derived from the summary in Rust
     (okf::description_from_summary) and regenerated on every save. */
  function FactCard({ fact, linkedGoals, onSave, onDelete }) {
    const [expanded, setExpanded] = useState(false);
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState(null);
    const [busy, setBusy] = useState(false);
    const titleRef = useAutoFocus(editing);

    const beginEdit = () => {
      setDraft({
        title: fact.title,
        summary: fact.summary,
        value: fact.value,
        tags: fact.tags.join(" "),
      });
      setEditing(true);
      setExpanded(false);
    };

    const save = async () => {
      if (!draft || !draft.title.trim() || !draft.summary.trim()) return;
      setBusy(true);
      const ok = await onSave(fact, {
        title: draft.title.trim(),
        summary: draft.summary.trim(),
        value: draft.value,
        tags: draft.tags.split(/[\s,]+/).map((t) => t.replace(/^#/, "")).filter(Boolean),
      });
      setBusy(false);
      if (ok) setEditing(false);
    };

    const set = (field) => (e) => setDraft(Object.assign({}, draft, { [field]: e.target.value }));

    const body = editing
      ? html`
        <div>
          <label class="field">
            <span>Title</span>
            <input type="text" value=${draft.title} ref=${titleRef} onInput=${set("title")} />
          </label>
          <label class="field">
            <span>What happened</span>
            <textarea class="edit-box" value=${draft.summary} onInput=${set("summary")}
                      onKeyDown=${(e) => {
                        if (e.key === "Escape") setEditing(false);
                        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
                      }} />
          </label>
          <label class="field">
            <span>Tags</span>
            <input type="text" value=${draft.tags} placeholder="ops incident"
                   onInput=${set("tags")} />
          </label>
          <div class="field">
            <span>Value</span>
            <div class="value-picker">
              ${VALUES.map((v) => html`
                <button key=${v} type="button" class=${draft.value === v ? "active" : ""}
                        onClick=${() => setDraft(Object.assign({}, draft, { value: v }))}>${v}</button>`)}
            </div>
          </div>
          <div class="task-actions">
            <button type="button" disabled=${busy || !draft.title.trim() || !draft.summary.trim()}
                    onClick=${save}>${busy ? "Saving…" : "Save"}</button>
            <button type="button" onClick=${() => setEditing(false)}>Cancel</button>
          </div>
        </div>`
      : html`
        <div>
          <div class="fact-title">${fact.title}</div>
          <div class="task-text" dangerouslySetInnerHTML=${{ __html: linkify(fact.summary) }} />
          ${(fact.tags.length > 0 || expanded) && html`
            <div class="task-meta">
              <${TagChips} tags=${fact.tags} />
              ${expanded && html`<span class="chip plain">${fact.wikilink_target}</span>`}
            </div>`}
          ${fact.attachment && html`
            <div class="task-links">📎 ${fact.attachment}</div>`}
          ${linkedGoals.length > 0 && html`
            <div class="task-links">↳ demonstrates ${linkedGoals.join(", ")}</div>`}
          ${expanded && html`
            <div>
              <div class="task-actions">
                <button type="button" onClick=${beginEdit}>Edit</button>
                <button type="button" class="danger" onClick=${() => onDelete(fact)}>Delete</button>
              </div>
              <p class="fact-note">
                ${fact.has_orig
                  ? "Editing rewrites this note only — the original message is kept verbatim in .orig."
                  : "This entry has no .orig companion file."}
              </p>
            </div>`}
        </div>`;

    return html`
      <div class="task fact">
        <div class="fact-value" aria-label=${"Value " + fact.value + " of 5"}>${fact.value}</div>
        <div class="task-body">${body}</div>
        ${!editing && html`
          <button class="more" aria-label="More actions"
                  onClick=${() => setExpanded(!expanded)}>⋯</button>`}
      </div>`;
  }

  /* `autofocus` is an attribute the browser only acts on while parsing, so an
     element Preact inserts into an already-rendered list gets the attribute and
     no focus. Both inline editors below open exactly that way, so focus has to
     be asked for explicitly -- without this the caret survival that keyed
     diffing buys is moot, because the caret was never in the box to begin with.
     (The two <dialog> fields are unaffected: showModal() honours autofocus.) */
  function useAutoFocus(active) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      if (!active || !el) return;
      el.focus();
      // Caret at the end, not selecting the whole value -- an edit box is for
      // amending what's there, and select-all makes the first keystroke
      // destructive.
      if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length);
    }, [active]);
    return ref;
  }

  // A <dialog> is imperative by nature (showModal/close), so the one place the
  // declarative tree has to reach into the DOM is here.
  function useDialog(open, onClose) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      if (open && !el.open) el.showModal();
      if (!open && el.open) el.close();
    }, [open]);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      // Esc and backdrop dismissal both fire `close` without going through our
      // buttons; without this the parent's state would say "open" forever.
      const handler = () => onClose();
      el.addEventListener("close", handler);
      return () => el.removeEventListener("close", handler);
    }, [onClose]);
    return ref;
  }

  function ComposeDialog({ open, domain, onClose, onAdd }) {
    const [text, setText] = useState("");
    const [busy, setBusy] = useState(false);
    const ref = useDialog(open, onClose);

    const submit = async () => {
      const trimmed = text.trim();
      if (!trimmed) return;
      setBusy(true);
      const ok = await onAdd(trimmed);
      setBusy(false);
      if (ok) setText("");
    };

    return html`
      <dialog id="compose-dialog" ref=${ref}>
        <div class="sheet">
          <h2>${domain.addTitle}</h2>
          <textarea id="new-text" value=${text} autofocus
                    placeholder=${domain.addPlaceholder}
                    onInput=${(e) => setText(e.target.value)}
                    onKeyDown=${(e) => {
                      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit();
                    }} />
          <div class="task-meta"><${TagChips} tags=${extractTags(text)} /></div>
          ${domain.addNote && html`<p class="sheet-note">${domain.addNote}</p>`}
          <div class="sheet-actions">
            <button class="btn" type="button" onClick=${onClose}>Cancel</button>
            <button class="btn primary" type="button" disabled=${busy || !text.trim()}
                    onClick=${submit}>${busy ? domain.busyLabel || "Adding…" : "Add"}</button>
          </div>
        </div>
      </dialog>`;
  }

  /* One confirm dialog, three different truths to tell. What a delete actually
     costs differs per domain -- a todo loses one file, a fact loses its raw
     original message and any attached document, and a goal that something
     still links to can't be deleted at all -- so the copy is built by the
     caller from what it knows, not guessed at here. */
  function DeleteDialog({ target, onClose, onConfirm }) {
    const ref = useDialog(!!target, onClose);
    return html`
      <dialog id="delete-dialog" ref=${ref}>
        <div class="sheet">
          <h2>Delete permanently?</h2>
          <p class="strong">${target ? target.label : ""}</p>
          ${target && target.lines.map((line, i) => html`<p key=${i}>${line}</p>`)}
          <div class="sheet-actions">
            <button class="btn" type="button" onClick=${onClose}>Cancel</button>
            <button class="btn danger" type="button" onClick=${onConfirm}>Delete</button>
          </div>
        </div>
      </dialog>`;
  }

  function Banner({ note }) {
    return html`
      <div id="banner" role="status"
           class=${(note ? "show " : "") + (note && note.ok ? "ok" : "")}>
        ${note ? note.text : ""}
      </div>`;
  }

  function Login({ onToken }) {
    const [code, setCode] = useState("");
    const [error, setError] = useState("");

    const submit = async (e) => {
      e.preventDefault();
      setError("");
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code.trim() }),
        });
        // Read the body as text first, then try to parse it as JSON -- a 401
        // from login_handler is JSON (`{"error": "..."}`), but a 429 from the
        // rate limiter in front of this route is plain text ("Too Many
        // Requests! Wait for Ns"), and blindly calling res.json() on that
        // throws, masking the real status behind a generic "network error".
        // Always surfacing res.status directly means a rate-limit and a bad
        // code are never confused again.
        const bodyText = await res.text();
        let data = null;
        try { data = JSON.parse(bodyText); } catch (parseErr) { /* not json */ }
        if (!res.ok) {
          setError("HTTP " + res.status + ": " + ((data && data.error) || bodyText || "login failed"));
          return;
        }
        if (!data || !data.token) {
          setError("unexpected response from server: " + bodyText);
          return;
        }
        onToken(data.token);
      } catch (err) {
        setError("network error: " + err.message);
      }
    };

    return html`
      <div id="login-screen">
        <form onSubmit=${submit}>
          <div class="mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
          </div>
          <h1>kamaji</h1>
          <p class="sub">Enter the code from your authenticator</p>
          <input id="totp" type="text" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]*" maxlength="6" placeholder="······" required autofocus
                 value=${code} onInput=${(e) => setCode(e.target.value)} />
          <div id="login-error">${error}</div>
          <button type="submit" class="btn primary" style="width:100%; margin-top:0.75rem">Unlock</button>
        </form>
      </div>`;
  }

  /* ================= root ================= */

  function App() {
    const [authed, setAuthed] = useState(!!token());
    // One store per domain, all three loaded together: goal deletion is gated
    // on what todos link to it, and a fact card names the goals it
    // demonstrates, so no tab is self-sufficient anyway -- and switching tabs
    // then costs no round trip.
    const [data, setData] = useState({ todo: [], goal: [], fact: [] });
    const [domainId, setDomainId] = useState(() => {
      const saved = safeGet(DOMAIN_KEY);
      return DOMAIN_IDS.includes(saved) ? saved : "todo";
    });
    const [scope, setScope] = useState(() => {
      const saved = safeGet(SCOPE_KEY);
      return ["day", "week", "month", "all"].includes(saved) ? saved : "day";
    });
    const [anchor, setAnchor] = useState(() => startOfDay(new Date()));
    const [note, setNote] = useState(null);
    const [composing, setComposing] = useState(false);
    const [deleting, setDeleting] = useState(null);

    const domain = DOMAINS[domainId];

    const notify = useCallback((text, ok) => {
      setNote({ text, ok: ok === true, at: Date.now() });
    }, []);

    useEffect(() => {
      if (!note) return;
      const t = setTimeout(() => setNote(null), 4000);
      return () => clearTimeout(t);
    }, [note]);

    const api = useCallback(async (path, options) => {
      options = options || {};
      const headers = Object.assign({}, options.headers, { Authorization: "Bearer " + token() });
      if (options.body !== undefined) headers["Content-Type"] = "application/json";
      const res = await fetch(path, Object.assign({}, options, { headers }));
      if (res.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        setAuthed(false);
        throw new Error("session expired, please log in again");
      }
      let data = null;
      try { data = await res.json(); } catch (e) { /* no body */ }
      if (!res.ok) {
        throw new Error((data && (data.error || data.message)) || ("request failed (" + res.status + ")"));
      }
      // A queued write answers 200 with `{ok: false, message}` when the
      // operation itself was refused (a goal that todos still link to, a fact
      // value out of range) -- that is a failure the user has to see, not a
      // success with a note attached.
      if (data && data.ok === false) throw new Error(data.message || "request failed");
      return data;
    }, []);

    const reload = useCallback(async () => {
      try {
        // `status=all` for the checklist domains rather than two round trips:
        // the completion score needs both halves of the same window, and every
        // scope filter below is a pure client-side slice of these lists.
        const [todo, goal, fact] = await Promise.all([
          api(DOMAINS.todo.list), api(DOMAINS.goal.list), api(DOMAINS.fact.list),
        ]);
        setData({ todo, goal, fact });
      } catch (err) {
        notify(err.message);
      }
    }, [api, notify]);

    useEffect(() => { if (authed) reload(); }, [authed, reload]);

    const items = data[domainId] || [];
    const scoped = useMemo(
      () => items.filter((e) => inScope(e, scope, anchor)),
      [items, scope, anchor]
    );
    const open = useMemo(() => scoped.filter((e) => e.status === "open"), [scoped]);
    const closed = useMemo(() => scoped.filter((e) => e.status === "closed"), [scoped]);

    // Which todos link to each goal, and which goals to each fact. Both are
    // the inbound half of a one-directional link (todo -> goal, goal -> fact),
    // so they can only be answered by scanning the linking side -- exactly
    // what the daemon does for the same two questions.
    const goalBacklinks = useMemo(() => {
      const map = {};
      for (const todo of data.todo) {
        for (const link of todo.links) (map[link] = map[link] || []).push(todo.key);
      }
      return map;
    }, [data.todo]);

    const factBacklinks = useMemo(() => {
      const map = {};
      for (const goal of data.goal) {
        for (const link of goal.links) (map[link] = map[link] || []).push(goal.key);
      }
      return map;
    }, [data.goal]);

    const goalLinksFor = useCallback(
      (entry) => goalBacklinks["goals/" + entry.key.slice(0, 4) + "/" + entry.key] || [],
      [goalBacklinks]
    );

    const onToggle = useCallback(async (entry) => {
      const action = entry.status === "closed" ? "reopen" : domain.closeVerb;
      try {
        await api(domain.base + "/" + encodeURIComponent(entry.key) + "/" + action, { method: "POST" });
        await reload();
      } catch (err) { notify(err.message); }
    }, [api, reload, notify, domain]);

    const onSave = useCallback(async (entry, text) => {
      try {
        await api(domain.base + "/" + encodeURIComponent(entry.key), {
          method: "PATCH",
          body: JSON.stringify({ text, tags: extractTags(text) }),
        });
        await reload();
        return true;
      } catch (err) { notify(err.message); return false; }
    }, [api, reload, notify, domain]);

    const onSaveFact = useCallback(async (fact, fields) => {
      try {
        await api("/api/facts?target=" + encodeURIComponent(fact.wikilink_target), {
          method: "PATCH",
          body: JSON.stringify(fields),
        });
        await reload();
        notify("Fact updated", true);
        return true;
      } catch (err) { notify(err.message); return false; }
    }, [api, reload, notify]);

    const onAdd = useCallback(async (text) => {
      try {
        // A fact is created by the same `/fact` pipeline chat uses -- the
        // agent writes its title/summary/value and the raw text becomes the
        // .orig -- so the request body is just that raw text, and the reply
        // is the daemon's own message rather than a status this page invents.
        const reply = await api(domain.base, {
          method: "POST",
          body: domainId === "fact"
            ? JSON.stringify({ text })
            : JSON.stringify({ text, tags: extractTags(text) }),
        });
        // A new entry is always filed under today, so a stale day/week/month
        // anchor would swallow it silently -- snap back to now rather than
        // letting a successful add look like a failure.
        if (scope !== "all") setAnchor(startOfDay(new Date()));
        setComposing(false);
        await reload();
        // Shown verbatim for a fact: the daemon's reply is the only thing
        // that knows whether the agent actually parsed (see
        // `create_fact_handler`), so inventing an "Added" here could paper
        // over an ingestion failure.
        notify(domainId === "fact" && reply && reply.message ? reply.message : "Added", true);
        return true;
      } catch (err) { notify(err.message); return false; }
    }, [api, reload, notify, scope, domain, domainId]);

    /* Every delete goes through one confirm dialog, but each domain has to say
       what it actually costs -- see DeleteDialog. */
    const askDeleteEntry = useCallback((entry) => {
      setDeleting({
        label: entry.text,
        lines: [
          "This removes the file and commits the removal. Unlike " +
            (domainId === "goal" ? "achieving a goal" : "completing a todo") +
            ", there is no reopening this one.",
        ],
        run: () => api(domain.base + "/" + encodeURIComponent(entry.key), { method: "DELETE" }),
      });
    }, [api, domain, domainId]);

    const askDeleteFact = useCallback((fact) => {
      const linked = factBacklinks[fact.wikilink_target] || [];
      const files = ["the note"]
        .concat(fact.has_orig ? ["the original message (.orig)"] : [])
        .concat(fact.attachment ? ["the attached " + fact.attachment.split("/").pop()] : []);
      const lines = [
        "This permanently removes " + files.join(", ") + ", and commits the removal.",
      ];
      if (linked.length > 0) {
        lines.push(
          linked.length + " goal" + (linked.length === 1 ? "" : "s") + " (" + linked.join(", ") +
          ") demonstrate" + (linked.length === 1 ? "s" : "") + " this fact. Those links will be " +
          "left pointing at a file that no longer exists."
        );
      }
      setDeleting({
        label: fact.title,
        lines,
        run: () => api("/api/facts?target=" + encodeURIComponent(fact.wikilink_target), { method: "DELETE" }),
      });
    }, [api, factBacklinks]);

    const onConfirmDelete = useCallback(async () => {
      const pending = deleting;
      setDeleting(null);
      if (!pending) return;
      try {
        await pending.run();
        await reload();
        notify("Deleted", true);
      } catch (err) { notify(err.message); }
    }, [deleting, reload, notify]);

    const onLogout = useCallback(async () => {
      try { await api("/auth/logout", { method: "POST" }); } catch (e) { /* ignore */ }
      localStorage.removeItem(TOKEN_KEY);
      setAuthed(false);
      setData({ todo: [], goal: [], fact: [] });
    }, [api]);

    const onScope = useCallback((next) => { setScope(next); safeSet(SCOPE_KEY, next); }, []);
    const onDomain = useCallback((next) => { setDomainId(next); safeSet(DOMAIN_KEY, next); }, []);

    if (!authed) {
      return html`
        <${Login} onToken=${(t) => { safeSet(TOKEN_KEY, t); setAuthed(true); }} />
        <${Banner} note=${note} />`;
    }

    const isFacts = domainId === "fact";
    const taskRow = (e) => html`
      <${Task} key=${itemId(e)} entry=${e} domain=${domain}
               blockedBy=${domainId === "goal" ? goalLinksFor(e) : null}
               onToggle=${onToggle} onSave=${onSave} onDelete=${askDeleteEntry} />`;
    const factRow = (f) => html`
      <${FactCard} key=${itemId(f)} fact=${f}
                   linkedGoals=${factBacklinks[f.wikilink_target] || []}
                   onSave=${onSaveFact} onDelete=${askDeleteFact} />`;

    // Facts have no open/closed split: the whole window is the list, and there
    // is no completed section under it.
    const listed = isFacts ? scoped : open;
    const total = scoped.length;

    return html`
      <div id="app">
        <${Hero} domain=${domain} done=${closed.length} total=${total}
                 facts=${scoped} onLogout=${onLogout} />
        <${DomainTabs} current=${domainId} onSelect=${onDomain} />
        <${FilterCard} scope=${scope} anchor=${anchor} onScope=${onScope} onAnchor=${setAnchor} />
        <main>
          <div id="list">
            ${listed.length === 0
              ? html`<${EmptyState} domain=${domain} hasCompleted=${closed.length > 0} />`
              : html`<${ItemList} entries=${listed} scope=${scope}
                                  row=${isFacts ? factRow : taskRow} />`}
          </div>
          ${!isFacts && html`
            <${DoneSection} entries=${closed} domain=${domain} row=${taskRow} />`}
          <footer class="tally">
            ${total === 0 ? ""
              : isFacts ? total + (total === 1 ? " fact" : " facts") + " logged here."
              : open.length === 0 ? "All " + total + " done. Nothing left here."
              : open.length + " of " + total + " still open."}
          </footer>
        </main>
      </div>
      <button id="fab" aria-label=${"Add " + domain.one} onClick=${() => setComposing(true)}>
        <${Icon} d="M12 5v14M5 12h14" size=${24} />
      </button>
      <${ComposeDialog} open=${composing} domain=${domain}
                        onClose=${() => setComposing(false)} onAdd=${onAdd} />
      <${DeleteDialog} target=${deleting} onClose=${() => setDeleting(null)}
                       onConfirm=${onConfirmDelete} />
      <${Banner} note=${note} />`;
  }

  render(html`<${App} />`, document.getElementById("root"));
})();
</script>
</body>
</html>
